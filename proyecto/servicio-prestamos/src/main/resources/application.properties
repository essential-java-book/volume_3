spring.application.name=servicio-prestamos
server.port=8083

# Host de Logstash (Capitulo 13): "localhost" fuera
# de Docker, "logstash" via LOGSTASH_HOST cuando lo
# levanta docker-compose.
logstash.host=${LOGSTASH_HOST:localhost}

spring.config.import=\
  optional:configserver:http://localhost:8888

spring.datasource.url=\
  jdbc:postgresql://postgres-prestamos:5432/\
  prestamos_db
spring.datasource.driver-class-name=\
  org.postgresql.Driver
spring.datasource.username=prestamos
spring.datasource.password=prestamos_pass

spring.jpa.hibernate.ddl-auto=validate

eureka.client.service-url.defaultZone=\
  http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

feign.client.config.default.logger-level=basic
logging.level.com.biblioteca.prestamos.cliente=DEBUG

resilience4j.circuitbreaker.instances.\
  servicio-libros.sliding-window-size=10
resilience4j.circuitbreaker.instances.\
  servicio-libros.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.\
  servicio-libros.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.\
  servicio-libros.ignore-exceptions=\
  feign.FeignException.NotFound

resilience4j.circuitbreaker.instances.\
  servicio-usuarios.sliding-window-size=10
resilience4j.circuitbreaker.instances.\
  servicio-usuarios.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.\
  servicio-usuarios.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.\
  servicio-usuarios.ignore-exceptions=\
  feign.FeignException.NotFound

resilience4j.retry.instances.servicio-libros.\
  max-attempts=3
resilience4j.retry.instances.servicio-libros.\
  wait-duration=500ms
resilience4j.retry.instances.servicio-libros.\
  ignore-exceptions=feign.FeignException.NotFound

resilience4j.retry.instances.servicio-usuarios.\
  max-attempts=3
resilience4j.retry.instances.servicio-usuarios.\
  wait-duration=500ms
resilience4j.retry.instances.servicio-usuarios.\
  ignore-exceptions=feign.FeignException.NotFound

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=\
  org.apache.kafka.common.serialization.\
  StringSerializer
spring.kafka.producer.value-serializer=\
  org.springframework.kafka.support.serializer.\
  JsonSerializer

# Consumidores del Kafka Listener de compensacion y
# del de la proyeccion CQRS (Capitulo 12): faltaba
# esta configuracion -- sin ella, el deserializador
# por defecto (String) habria roto ambos listeners
# en cuanto hubiera un broker Kafka real (Capitulo
# 13, hallazgo propio de este capitulo).
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=\
  org.apache.kafka.common.serialization.\
  StringDeserializer
spring.kafka.consumer.value-deserializer=\
  org.springframework.kafka.support.serializer.\
  JsonDeserializer
spring.kafka.consumer.properties.spring.json.\
  trusted.packages=com.biblioteca.prestamos.evento
spring.kafka.consumer.properties.spring.json.\
  value.default.type=\
  com.biblioteca.prestamos.evento.PrestamoEvento
spring.kafka.consumer.properties.spring.json.\
  use.type.headers=false
