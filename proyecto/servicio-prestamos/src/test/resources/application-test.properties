# Perfil "test" (Capitulo 15): activado por el
# pipeline de CI/CD con -Dspring.profiles.active=test.
# Sustituye PostgreSQL/Flyway por H2 en memoria: el
# runner de GitHub Actions no tiene un Postgres real
# escuchando, y las migraciones Flyway de este modulo
# (incluidas outbox y proyeccion, Capitulo 12) usan
# sintaxis propia de PostgreSQL, incompatible con H2
# tal cual -- en vez de forzarlas, se desactiva Flyway
# y se deja que Hibernate genere el esquema
# directamente de las entidades (create-drop), solo
# para este perfil de test.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
eureka.client.enabled=false
