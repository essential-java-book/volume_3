# config-server: Deployment + Service (Capitulo 14).
# Imagen local, la misma que construyo
# "docker compose up --build" en el cap. 13 --
# "minikube image load" la importa al cluster
# (imagePullPolicy: Never, no intenta descargarla
# de ningun registro; eso llega en el cap. 15 con
# Docker Hub). Las sondas usan los grupos de salud
# de Kubernetes de Actuator (activos solo dentro
# de Kubernetes, sin configuracion extra: Spring
# Boot detecta KUBERNETES_SERVICE_HOST).
#
# Umbrales de sonda generosos -- hallazgo real de
# verificacion (15/9/2026): en un nodo minikube con
# recursos por defecto (2 CPU/4 GB) arrancando los
# ocho modulos a la vez, mas el docker compose del
# cap. 13 en el mismo equipo, cada JVM tarda mucho
# mas de lo normal por pura contencion de CPU, no
# por ningun fallo propio. Con los umbrales cortos
# originales, la sonda de vida mataba el contenedor
# antes de que terminara de arrancar -- bucle de
# reinicio infinito. Corregido dando bastante mas
# margen (no es apto para produccion: es una
# decision explicita para un cluster local de un
# solo nodo con recursos compartidos).
#
# SPRING_PROFILES_ACTIVE propio (bug real
# encontrado y corregido en verificacion,
# 15/9/2026): sin este env propio, el
# SPRING_PROFILES_ACTIVE=kubernetes del ConfigMap
# comun pisaba el spring.profiles.active=native
# empaquetado en este modulo (cap. 5) -- una
# variable de entorno siempre gana sobre esa
# propiedad. Sin el perfil "native" activo, Config
# Server cae al repositorio Git por defecto y falla
# al arrancar ("You need to configure a uri for the
# git repository"). Aqui una variable de entorno
# propia del Deployment gana sobre la del ConfigMap
# cuando coinciden en nombre, asi que fijamos
# explicitamente native,kubernetes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: proyecto-config-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: biblioteca-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: native,kubernetes
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8888
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
