# authorization-server: Deployment + Service (Capitulo 14).
# Imagen local, la misma que construyo
# "docker compose up --build" en el cap. 13 --
# "minikube image load" la importa al cluster
# (imagePullPolicy: Never, no intenta descargarla
# de ningun registro; eso llega en el cap. 15 con
# Docker Hub). Las sondas usan los grupos de salud
# de Kubernetes de Actuator (activos solo dentro
# de Kubernetes, sin configuracion extra: Spring
# Boot detecta KUBERNETES_SERVICE_HOST).
#
# Umbrales de sonda generosos -- hallazgo real de
# verificacion (15/9/2026): en un nodo minikube con
# recursos por defecto (2 CPU/4 GB) arrancando los
# ocho modulos a la vez, mas el docker compose del
# cap. 13 en el mismo equipo, cada JVM tarda mucho
# mas de lo normal por pura contencion de CPU, no
# por ningun fallo propio. Con los umbrales cortos
# originales, la sonda de vida mataba el contenedor
# antes de que terminara de arrancar -- bucle de
# reinicio infinito. Corregido dando bastante mas
# margen (no es apto para produccion: es una
# decision explicita para un cluster local de un
# solo nodo con recursos compartidos).
#
# La URL de SPRING_DATASOURCE_URL es un valor
# unico e indivisible: supera las 66 columnas por
# la propia longitud de "host.minikube.internal".
# Misma excepcion ya aplicada a los "import" de
# Java y a las lineas de Kafka del docker-compose.yml
# del cap. 13, aqui extendida a este caso concreto.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-server
  labels:
    app: authorization-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authorization-server
  template:
    metadata:
      labels:
        app: authorization-server
    spec:
      containers:
        - name: authorization-server
          image: proyecto-authorization-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: biblioteca-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: >-
                jdbc:postgresql://host.minikube.internal:5436/auth_db
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: authorization-server
spec:
  selector:
    app: authorization-server
  ports:
    - port: 9000
      targetPort: 9000
