spring.application.name=servicio-notificaciones
server.port=8084

spring.config.import=\
  optional:configserver:http://localhost:8888

eureka.client.service-url.defaultZone=\
  http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=\
  servicio-notificaciones
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=\
  org.apache.kafka.common.serialization.\
  StringDeserializer
spring.kafka.consumer.value-deserializer=\
  org.springframework.kafka.support.serializer.\
  JsonDeserializer
spring.kafka.consumer.properties.spring.json.\
  trusted.packages=\
  com.biblioteca.notificaciones.evento
spring.kafka.consumer.properties.spring.json.\
  value.default.type=\
  com.biblioteca.notificaciones.evento.PrestamoEvento
spring.kafka.consumer.properties.spring.json.\
  use.type.headers=false
