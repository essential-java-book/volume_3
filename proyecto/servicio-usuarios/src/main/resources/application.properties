spring.application.name=servicio-usuarios
server.port=8082

# Host de Logstash (Capitulo 13): "localhost" fuera
# de Docker, "logstash" via LOGSTASH_HOST cuando lo
# levanta docker-compose.
logstash.host=${LOGSTASH_HOST:localhost}

spring.config.import=\
  optional:configserver:http://localhost:8888

spring.datasource.url=\
  jdbc:postgresql://postgres-usuarios:5432/usuarios_db
spring.datasource.driver-class-name=\
  org.postgresql.Driver
spring.datasource.username=usuarios
spring.datasource.password=usuarios_pass

spring.jpa.hibernate.ddl-auto=validate

eureka.client.service-url.defaultZone=\
  http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=servicio-usuarios
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=\
  org.apache.kafka.common.serialization.\
  StringDeserializer
spring.kafka.consumer.value-deserializer=\
  org.springframework.kafka.support.serializer.\
  JsonDeserializer
spring.kafka.consumer.properties.spring.json.\
  trusted.packages=com.biblioteca.usuarios.evento
spring.kafka.consumer.properties.spring.json.\
  value.default.type=\
  com.biblioteca.usuarios.evento.PrestamoEvento
spring.kafka.consumer.properties.spring.json.\
  use.type.headers=false
spring.kafka.producer.key-serializer=\
  org.apache.kafka.common.serialization.\
  StringSerializer
spring.kafka.producer.value-serializer=\
  org.springframework.kafka.support.serializer.\
  JsonSerializer
