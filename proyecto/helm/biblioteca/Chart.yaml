# Chart.yaml (Capitulo 15): empaqueta como Helm los
# mismos ocho Deployment/Service del Capitulo 14 (mas
# el ConfigMap y el Ingress), parametrizados por
# entorno con values.yaml/values-staging.yaml/
# values-prod.yaml. El Capitulo 14 no usaba Helm a
# proposito (Kubernetes puro, sin ninguna capa mas);
