# ingress.yaml (Capitulo 15): mismo Ingress del
# Capitulo 14 (recorte de prefijo /api hacia
# api-gateway), con el host parametrizado por
# entorno -- vacio en local (values.yaml, igual que
# el Capitulo 14: se llega por "minikube tunnel"),
# con nombre real en values-staging.yaml/values-
# prod.yaml.
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biblioteca-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: {{
                    (index .Values.services
                      "api-gateway").port }}
{{- end }}
