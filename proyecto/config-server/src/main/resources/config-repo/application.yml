# Configuracion comun a los ocho modulos.
# Cada modulo la recibe primero y luego la suya
# propia (<spring.application.name>.yml) la
# completa o la sobreescribe.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"
