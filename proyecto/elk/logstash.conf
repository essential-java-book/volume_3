# Pipeline de Logstash (Capitulo 13): recibe por
# TCP los logs JSON que cada servicio de negocio
# envia con LogstashTcpSocketAppender (uno por
# linea, por eso "json_lines") y los reenvia a
# Elasticsearch para que Kibana pueda consultarlos.
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "biblioteca-logs-%{+YYYY.MM.dd}"
  }
}
